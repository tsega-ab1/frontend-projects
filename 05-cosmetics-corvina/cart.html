<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Your Bag — Corvina</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,400;0,500;1,400&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<a href="index.html" class="mark">Corvina</a>
<button class="menu-toggle" onclick="document.getElementById('menu').classList.add('open')">Menu</button>

<div class="menu-overlay" id="menu">
  <button class="menu-close" onclick="document.getElementById('menu').classList.remove('open')">Close</button>
  <a href="index.html">Home</a>
  <a href="product.html">Calm Serum</a>
  <a href="cart.html">Bag</a>
</div>

<main class="bag-page">
  <h1>Your Bag</h1>
  <div id="cart-items"></div>
  <div class="bag-totals" id="cart-summary" style="display:none;">
    <div class="row"><span>Subtotal</span><span id="subtotal"></span></div>
    <div class="row"><span>Shipping</span><span id="shipping"></span></div>
    <div class="row total"><span>Total</span><span id="total"></span></div>
    <button class="buy-cta" style="margin-top:20px;" onclick="alert('Demo checkout — connect a real payment processor (Stripe, etc.) before launch.')">Checkout</button>
  </div>
</main>

<footer class="colophon">© 2026 Corvina Skincare · Shipping &amp; Returns · Privacy</footer>

<script src="js/cart.js"></script>
<script>
function renderCart() {
  const cart = getCart();
  const list = document.getElementById('cart-items');
  const summary = document.getElementById('cart-summary');
  if (cart.length === 0) {
    list.innerHTML = '<div class="empty-bag">Your bag is empty. <a href="index.html" style="border-bottom:1px solid var(--ink);">Continue browsing →</a></div>';
    summary.style.display = 'none';
    return;
  }
  list.innerHTML = cart.map((item, i) => `
    <div class="bag-item">
      <div class="img-placeholder" style="--ratio:1/1" data-label="${item.name}"></div>
      <div><h3>${item.name}</h3><p>${item.size} · Qty ${item.qty}</p></div>
      <div style="text-align:right;">
        <p style="font-weight:600;">$${(item.price * item.qty).toFixed(2)}</p>
        <a href="#" onclick="removeItem(${i}); return false;" style="font-size:0.8rem; color:var(--fog);">Remove</a>
      </div>
    </div>
  `).join('');
  const subtotal = cart.reduce((s, i) => s + i.price * i.qty, 0);
  const shipping = subtotal >= 50 ? 0 : 6;
  document.getElementById('subtotal').textContent = `$${subtotal.toFixed(2)}`;
  document.getElementById('shipping').textContent = shipping === 0 ? 'Free' : `$${shipping.toFixed(2)}`;
  document.getElementById('total').textContent = `$${(subtotal + shipping).toFixed(2)}`;
  summary.style.display = 'block';
}
function removeItem(i) { const cart = getCart(); cart.splice(i, 1); saveCart(cart); renderCart(); }
document.addEventListener('DOMContentLoaded', renderCart);
</script>
</body>
</html>
